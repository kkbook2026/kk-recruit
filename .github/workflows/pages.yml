name: Cap nhat 100 nha tuyen dung hang ngay
# Lịch 03:00 giờ Việt Nam (20:00 UTC): cập nhật data/employers.json (50 VN + 50 toàn cầu) từ Wikidata,
# commit nếu có thay đổi rồi yêu cầu GitHub Pages dựng lại (Pages phục vụ từ nhánh main, thư mục gốc).
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: employers-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cập nhật từ Wikidata (lỗi mạng giữ dữ liệu cũ)
        run: |
          node scripts/update_employers.js --file=data/employers.json --quiet || echo "Giữ dữ liệu hiện có"
          mkdir -p site/data && cp data/employers.json site/data/employers.json
      - name: Commit nếu có thay đổi
        id: commit
        run: |
          git config user.name "kk-recruit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/employers.json site/data/employers.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else
            git commit -m "Cập nhật dữ liệu nhà tuyển dụng $(date -u +%Y-%m-%d)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Yêu cầu GitHub Pages dựng lại
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
