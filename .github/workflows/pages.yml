name: Deploy KK-RECRUITMENT to GitHub Pages
# Triển khai khi push + cập nhật dữ liệu 100 nhà tuyển dụng hàng đầu (50 VN + 50 toàn cầu) hằng ngày 03:00 giờ Việt Nam.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cập nhật data/employers.json từ Wikidata (lỗi mạng không làm hỏng bản triển khai)
        run: node scripts/update_employers.js --file=site/data/employers.json --quiet || echo "Giữ dữ liệu hiện có"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
